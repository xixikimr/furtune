<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 宇宙運勢導航</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: linear-gradient(to bottom, #a1c4fd 0%, #1e3c72 40%, #050505 100%); 
            background-attachment: fixed;
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 40px 20px; 
            box-sizing: border-box; 
            position: relative;
            overflow-x: hidden;
        }

        .stars-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 0.9; transform: scale(1); }
        }

        .card { 
            background: rgba(10, 20, 40, 0.2); 
            backdrop-filter: blur(15px); 
            padding: 30px; 
            border-radius: 40px; 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
            margin: auto;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 40px; 
            padding: 6px; 
            background: linear-gradient(45deg, #ffffff, #d4af37, #fcf6ba, #ffffff);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        h1 { font-size: 26px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); margin-bottom: 25px; letter-spacing: 4px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { font-size: 13px; color: #fcf6ba; font-weight: bold; margin-left: 10px; }
        
        input { 
            width: 100%; padding: 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.3); 
            background: rgba(255,255,255,0.1); color: white; outline: none; box-sizing: border-box; 
            font-size: 16px; margin-top: 8px; 
        }

        .section { 
            margin: 18px 0; padding: 15px; background: rgba(0, 0, 0, 0.3); 
            border-radius: 20px; text-align: left; border-left: 5px solid #d4af37;
        }

        .label { font-size: 11px; color: #ccc; margin-bottom: 5px; }
        .value { font-size: 18px; font-weight: bold; line-height: 1.4; }
        
        .mood-selector { margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .mood-title { font-size: 14px; color: #fcf6ba; margin-bottom: 15px; }
        .mood-btns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; justify-items: center; }
        .mood-btn { cursor: pointer; transition: transform 0.2s; filter: grayscale(0.5); font-size: 26px; }
        .mood-btn:hover { transform: scale(1.3); filter: grayscale(0); }
        #moodFeedback { font-size: 14px; margin-top: 15px; color: #ffffff; font-style: italic; min-height: 42px; line-height: 1.5; }

        .main-btn { 
            background: linear-gradient(45deg, #ffffff, #d4af37, #fcf6ba); 
            color: #000; border: none; padding: 18px; border-radius: 50px; 
            font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; 
            margin-top: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); transition: 0.3s;
        }
        .reset-btn { background: transparent; color: #aaa; border: 1px solid #555; padding: 8px 15px; border-radius: 20px; font-size: 12px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div class="stars-container" id="starsContainer"></div>

<div class="card">
    <div id="inputArea">
        <h1>✨ 宇宙運勢導航</h1>
        <div class="input-group">
            <label>你的稱呼</label>
            <input type="text" id="userName" placeholder="旅人">
        </div>
        <div class="input-group">
            <label>你的生日</label>
            <input type="date" id="userBirthday">
        </div>
        <button class="main-btn" onclick="calculateFortune()">獲取啟示</button>
    </div>

    <div id="resultArea" style="display: none;">
        <div id="greeting" style="font-weight: bold; margin: 20px 0; font-size: 18px;"></div>
        
        <div class="section">
            <div class="label">🎴 今日塔羅牌義</div>
            <div id="tarot" class="value" style="color: #fcf6ba;"></div>
            <div id="tarotDesc" style="font-size: 14px; margin-top: 8px; line-height: 1.6; color: #eee; font-style: italic;"></div>
        </div>

        <div class="section" style="border-left-color: #4caf50;"><div class="label">○ 此刻宜</div><div id="todo" class="value" style="color:#81c784"></div></div>
        <div class="section" style="border-left-color: #f44336;"><div class="label">✕ 此刻忌</div><div id="notodo" class="value" style="color:#e57373"></div></div>
        <div class="section" style="border-left-color: #ffffff;"><div class="label">💡 靈魂私語</div><div id="soulAdvice" class="value" style="color:#fff176"></div></div>

        <div class="mood-selector">
            <div class="mood-title">選一個當下的心情符號</div>
            <div class="mood-btns" id="moodContainer"></div>
            <div id="moodFeedback"></div>
        </div>
        <button class="reset-btn" onclick="resetForm()">返回修改</button>
    </div>
</div>

<script>
    const starContainer = document.getElementById('starsContainer');
    for (let i = 0; i < 80; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = (Math.random() * 3 + 2) + 'px';
        star.style.width = size; star.style.height = size;
        star.style.top = Math.random() * 100 + '%';
        star.style.left = Math.random() * 100 + '%';
        star.style.setProperty('--duration', Math.random() * 3 + 2 + 's');
        star.style.animationDelay = Math.random() * 5 + 's';
        starContainer.appendChild(star);
    }

    function seededRandom(seed) { var x = Math.sin(seed) * 10000; return x - Math.floor(x); }

    const tarotData = [
        {name:"0. 愚者",desc:"代表純真、新的冒險與無限可能。這是一個提醒你/妳放下恐懼，勇敢踏出舒適圈的時刻，宇宙正守護著你/妳的初衷。"},
        {name:"1. 魔術師",desc:"代表創造力與掌握資源。你/妳擁有成功所需的一切工具，現在是將想法付諸行動的絕佳機會，發揮你/妳的才華吧。"},
        {name:"2. 女祭司",desc:"代表直覺、潛意識與神秘智慧。外在的喧囂不重要，請靜下心來聽從內心的聲音，答案就藏在你/妳的直覺裡。"},
        {name:"3. 皇后",desc:"代表豐盛、母性與美感。這是一個充滿吸引力的時刻，適合享受生活、與自然連結或進行任何藝術創作。"},
        {name:"4. 皇帝",desc:"代表紀律、穩定與領導力。建立明確的秩序與規範能帶給你/妳安全感，自律將會引領你/妳走向目標。"},
        {name:"5. 教皇",desc:"代表傳統、指引與精神啟示。尋求長輩或導師的建議會有所收穫，遵守既有的價值觀將帶來幸運。"},
        {name:"6. 戀人",desc:"代表和諧、選擇與關係。無論是人際關係還是重要決策，請以愛為出發點，尋求心靈上的平衡。"},
        {name:"7. 戰車",desc:"代表意志、克服障礙與勝利。只要下定決心並保持專注，任何困難都無法阻擋你/妳前進的腳步，去爭取勝利。"},
        {name:"8. 力量",desc:"代表勇氣、韌性與耐性。溫柔的力量有時比剛強更有用，用包容與內在的堅韌來化解眼前的僵局。"},
        {name:"9. 隱士",desc:"代表內省、孤獨與沉澱。暫時遠離人群的社交是必要的，在獨處中思考，你/妳會找到真正的真理。"},
        {name:"10. 命運之輪",desc:"代表轉機、輪迴與不可預期的變化。命運正在轉動，接受當下的變動，那是宇宙為你/妳安排的幸運起點。"},
        {name:"11. 正義",desc:"代表公平、誠實與因果平衡。誠實面對自己與他人，你/妳過去所種下的因，將在今日收穫應得的果。"},
        {name:"12. 倒吊人",desc:"代表犧牲、等待與換位思考。停滯並非退步，而是為了讓你/妳用不同的視角看世界，靜待更好的契機。"},
        {name:"13. 死神",desc:"代表結束、轉化與重生。不要害怕割捨舊有的模式或物品，唯有徹底的結束，新的生命才能萌芽。"},
        {name:"14. 節制",desc:"代表調和、平和與心靈鍊金。這是一個尋求中道、控制情緒的時刻，平衡生活中的極端能帶給你/妳平靜。"},
        {name:"15. 惡魔",desc:"代表束縛、慾望與覺察。看清是什麼在制約著你/妳，不管是物質慾望還是負面習慣，今日是打破枷鎖的好日子。"},
        {name:"16. 高塔",desc:"代表震撼、突變與重建。不穩固的結構會倒塌，這雖然令人震驚，卻是為了讓你/妳在廢墟上建立更穩定的未來。"},
        {name:"17. 星星",desc:"代表希望、療癒與平靜。漫長的黑夜即將過去，願望的種子正在萌芽，保持正向的心態，未來是光明的。"},
        {name:"18. 月亮",desc:"代表不安、幻象與潛意識。恐懼往往來自未知，試著穿透迷霧看清事物的本質，信任你/妳的靈魂覺察力。"},
        {name:"19. 太陽",desc:"代表成功、活力與純真。你/妳正處於光芒萬丈的時刻，開朗與自信將會感染身邊的人，盡情享受這份快樂。"},
        {name:"20. 審判",desc:"代表重生、覺醒與使命召喚。聽從內心靈魂的呼喚，勇敢面對過去並接受新的人生層次，迎接全新的你/妳。"},
        {name:"21. 世界",desc:"代表圓滿、達成與完美落幕。一個階段已經完成，你/妳正處於最和諧的狀態，準備好帶著智慧進入下一個篇章。"}
    ];

    const pre = ["現在的你/妳", "你/妳的直覺", "這段時間", "某個念頭", "內在的你/妳", "當下的能量", "宇宙的頻率", "靈魂深處", "這份寂靜", "此刻的心情", "生活", "身邊的人"];
    const mid = ["正悄悄引導你/妳", "提醒你/妳要記得", "正溫柔地洗滌", "將會轉化成", "正試著告訴你/妳", "正緩緩照亮", "幫助你/妳去重新", "正邀請你/妳一同", "正悄悄治癒", "支持你/妳勇敢", "正在醞釀一份", "正試著放開"];
    const suf = ["擁抱內心的光", "放下不必要的重擔", "看見生命的美感", "遇見美好的驚喜", "找回最純真的笑容", "創造屬於你/妳的奇蹟", "體驗當下的豐盛", "達成心靈的和解", "獲得深層的平靜", "發現潛藏的寶藏", "穿越眼前的迷霧", "點燃靈魂的熱情"];

    const pool = ["喝手搖飲","大口吃肉","買新衣服","整理房間","跟貓說話","深呼吸","早點睡覺","聯絡老友","去圖書館","換個髮型","大笑三聲","冥想五分","買份禮物","寫日記","修剪指甲","換新床單","運動排汗","聽音樂","看場電影","嘗試新菜","讚美別人","斷捨離","發呆放空","存一點錢","勇敢拒絕","主動道歉","練習瑜伽","喝溫開水","聽PODCAST","逛花市","洗泡泡浴","拍美照","抱抱腦公","看風景","準時下班","早起吃早餐","練習感恩","閱讀新書","玩場遊戲","整理相簿","唱歌紓壓","點香氛燈","吃水果","喝熱可可","做伸展操","買束鮮花","研究星盤","修剪頭髮","寫張卡片","對鏡子笑","聽海浪聲","赤腳踩地","修剪眉毛","喝杯好茶","看夕陽","早起看日出","吃塊巧克力","看紀錄片","逛展覽","做手工藝","噴喜歡的香水","寫封電子郵件","整理桌面","練習書法","煮一鍋湯","去公園走走","拉伸背部","吃一份甜點","看星座運勢","整理錢包","洗車","練習深蹲","早半小時起床","換個手機桌布","修剪盆栽","聽老歌","看風景照","喝杯檸檬水","做家事","去咖啡廳","看雲朵","整理通訊錄","練習正念","吃清淡一點","早點關燈","寫下夢境","觀察路人","去河邊散步","整理電腦文件","洗熱水澡","換雙好穿的鞋","給自己買咖啡","看有趣漫畫","練習畫畫","整理飾品","聽雨聲","給自己一個讚","做頭部按摩","看星空","寫感謝名單","聽蟬鳴","去廟裡走走","練習專注","吃當季蔬菜","換件亮色的衣服","早點吃晚餐","練習呼吸法","修整指甲邊緣","聽一場演講","練習愛自己","去市場逛逛","看藝術畫集","喝溫牛奶","練習微笑"];

    function calculateFortune() {
        const nameInput = document.getElementById('userName').value.trim();
        const name = nameInput === "" ? "旅人" : nameInput;
        const bday = document.getElementById('userBirthday').value;
        if(!bday) { alert("請先選取你的生日！"); return; }
        
        const now = new Date();
        const dateSeed = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
        const hourSeed = now.getHours();
        const bdaySum = bday.split('-').reduce((a, b) => a + parseInt(b), 0);
        const masterSeed = dateSeed + hourSeed + bdaySum;

        document.getElementById('inputArea').style.display = 'none';
        document.getElementById('resultArea').style.display = 'block';

        const tIdx = masterSeed % 22;
        document.getElementById('tarot').innerText = tarotData[tIdx].name;
        document.getElementById('tarotDesc').innerText = tarotData[tIdx].desc;

        const todoIdx = Math.floor(seededRandom(masterSeed) * pool.length);
        const notodoIdx = Math.floor(seededRandom(masterSeed + 7) * pool.length);
        document.getElementById('todo').innerText = pool[todoIdx];
        document.getElementById('notodo').innerText = pool[notodoIdx === todoIdx ? (notodoIdx + 1) % pool.length : notodoIdx];

        const p = pre[Math.floor(seededRandom(masterSeed) * pre.length)];
        const m = mid[Math.floor(seededRandom(masterSeed + 3) * mid.length)];
        const s = suf[Math.floor(seededRandom(masterSeed + 6) * suf.length)];
        document.getElementById('soulAdvice').innerText = `${p}${m}${s}。`;

        document.getElementById('greeting').innerText = `✨ ${name}，宇宙此刻啟示：`;
        renderMoods();
    }

    const moods = [
        {e:'😊', f:'宇宙收到了你/妳的喜悅，今天會加倍幸運！'},
        {e:'😌', f:'平靜是最高級的能量，你/妳現在正處於最好的頻率。'},
        {e:'🥺', f:'沒事的，宇宙正溫柔地抱著你/妳，深呼吸一下。'},
        {e:'😴', f:'累了就休息吧，夢境裡有給你/妳的禮物。'},
        {e:'🔥', f:'這股動力很棒！去創造屬於你/妳的奇蹟吧。'},
        {e:'🫣', f:'羞澀或是期待？不管怎樣，好事正悄悄發生喔。'},
        {e:'🤔', f:'正在思考嗎？靜下心來，答案就在你/妳心底。'},
        {e:'😏', f:'看來你/妳已經掌控了一切，宇宙也為你/妳喝采。'},
        {e:'😰', f:'壓力大嗎？沒事的，星星會守護你/妳度過暗礁。'},
        {e:'🫥', f:'想隱身一下也沒關係，宇宙允許你/妳暫時留白。'}
    ];

    function renderMoods() {
        const container = document.getElementById('moodContainer');
        container.innerHTML = '';
        moods.forEach(m => {
            const span = document.createElement('span');
            span.className = 'mood-btn'; span.innerText = m.e;
            span.onclick = () => {
                document.getElementById('moodFeedback').innerText = m.f;
                document.querySelectorAll('.mood-btn').forEach(b => b.style.filter = 'grayscale(0.8)');
                span.style.filter = 'grayscale(0)'; span.style.transform = 'scale(1.3)';
            };
            container.appendChild(span);
        });
    }

    function resetForm() {
        document.getElementById('inputArea').style.display = 'block';
        document.getElementById('resultArea').style.display = 'none';
        document.getElementById('moodFeedback').innerText = '';
    }
</script>

</body>
</html>
